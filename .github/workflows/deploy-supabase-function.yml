name: Deploy Supabase Edge Function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/sync-tredict/**'
      - 'supabase/functions/espn-fantasy-sync/**'
      - 'supabase/functions/trigger-garmin-sync/**'
      - 'supabase/functions/espn-weekly-digest/**'
      - 'supabase/functions/espn-sunday-report/**'
      - 'supabase/functions/espn-fdr-sync/**'
      - 'supabase/functions/espn-morning-digest/**'
      - 'supabase/functions/govee-lights/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy sync-tredict
        run: supabase functions deploy sync-tredict --project-ref mhvduufxeqyxgkkvwimx
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy espn-fantasy-sync
        run: supabase functions deploy espn-fantasy-sync --project-ref mhvduufxeqyxgkkvwimx --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy trigger-garmin-sync
        run: supabase functions deploy trigger-garmin-sync --project-ref mhvduufxeqyxgkkvwimx --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy espn-weekly-digest
        run: supabase functions deploy espn-weekly-digest --project-ref mhvduufxeqyxgkkvwimx --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy espn-sunday-report
        run: supabase functions deploy espn-sunday-report --project-ref mhvduufxeqyxgkkvwimx --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy espn-fdr-sync
        run: supabase functions deploy espn-fdr-sync --project-ref mhvduufxeqyxgkkvwimx --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy espn-morning-digest
        run: supabase functions deploy espn-morning-digest --project-ref mhvduufxeqyxgkkvwimx --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy govee-lights
        run: supabase functions deploy govee-lights --project-ref mhvduufxeqyxgkkvwimx --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Zet GOVEE_KEY als Supabase-secret vanuit het GitHub-secret met dezelfde
      # naam (Settings -> Secrets and variables -> Actions). Overgeslagen zolang
      # het GitHub-secret nog niet bestaat.
      - name: Zet GOVEE_KEY secret in Supabase
        run: |
          if [ -n "$GOVEE_KEY" ]; then
            supabase secrets set GOVEE_KEY="$GOVEE_KEY" --project-ref mhvduufxeqyxgkkvwimx
          else
            echo "GOVEE_KEY GitHub-secret niet gezet, overgeslagen"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOVEE_KEY: ${{ secrets.GOVEE_KEY }}
