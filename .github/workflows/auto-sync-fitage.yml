name: Auto-sync FITAGE

# Synct gewicht + lichaamssamenstelling (vetpercentage, spierpercentage,
# water, bot, BMI, BMR, visceraal vet) van een FITAGE/QNClouds-weegschaal
# naar Supabase. Zie scripts/sync_fitage.py voor het (reverse-engineerde,
# niet-officiele) protocol en de bijbehorende kanttekeningen.
#
# Vereiste repo-secrets (Settings -> Secrets and variables -> Actions):
#   FITAGE_EMAIL_NANDO, FITAGE_PASSWORD_NANDO  (je gewone FITAGE-app-login)
#   GARMIN_EMAIL_NANDO, GARMIN_PASSWORD_NANDO  (al aanwezig sinds de oude
#     Garmin-sync -- hergebruikt hier om de meest recente FITAGE-weging
#     terug te schrijven naar Garmin, zie sync_fitage.py bovenaan voor
#     waarom dit de oude onofficiele garminconnect-login nodig heeft i.p.v.
#     de (alleen-lezen) Personal API)
#
# Een weegschaal wordt doorgaans hooguit een paar keer per dag gebruikt --
# in tegenstelling tot Garmin's doorlopende activiteiten-/vitals-stroom is
# een uurlijkse cron hier overkill. Elke 2 uur is ruim voldoende; gebruik
# "Run workflow" hierboven voor een directe sync na het wegen.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync-fitage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installeer dependencies
        run: pip install --upgrade pycryptodome requests garminconnect curl_cffi

      - name: Sync FITAGE voor Nando
        env:
          FITAGE_OWNER: Nando
          FITAGE_EMAIL: ${{ secrets.FITAGE_EMAIL_NANDO }}
          FITAGE_PASSWORD: ${{ secrets.FITAGE_PASSWORD_NANDO }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL_NANDO }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD_NANDO }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/sync_fitage.py
