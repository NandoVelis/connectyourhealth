name: Auto-sync Garmin

# Synct vitals, trainingsactiviteiten en gewicht -- nu Tredict's API
# betaalde toegang vereist (402) is dit de belangrijkste bron geworden,
# niet meer alleen een test-aanvulling. Zie scripts/sync_garmin.py voor
# uitleg waarom dit als Python GitHub Action draait i.p.v. als Supabase
# edge function.
#
# Vereiste repo-secrets (Settings -> Secrets and variables -> Actions):
#   GARMIN_EMAIL_NANDO, GARMIN_PASSWORD_NANDO  (je gewone Garmin Connect-login)
#
# Bij de EERSTE run kan Garmin een MFA-code vragen. Start de workflow dan
# handmatig via "Run workflow" hierboven met de mfa_code-input ingevuld
# (code uit je Garmin-e-mail/authenticator-app). Daarna hergebruikt elke
# geplande run de opgeslagen sessie, geen MFA meer nodig totdat die verloopt.

on:
  schedule:
    # Elk uur, behalve:
    # - 12:00-14:00 lokaal (lunchpauze): elke 15 min -- op verzoek, i.p.v.
    #   de hele dag elke 15 min.
    # - 6:00-8:00 lokaal, doordeweeks (ma-vr): elke 10 min -- op verzoek,
    #   24 sept... (6 okt): Nando weegt zichzelf in dit venster en wil het
    #   gewicht snel terugzien i.p.v. tot de volgende hele-uur-sync wachten;
    #   na 8:00 is hij op werk en komt er toch geen nieuw gewicht meer bij,
    #   dus geen extra frequentie nodig buiten dit venster.
    # Cron draait in UTC; 10-11 UTC = 12:00-13:59 lokale tijd en 4-5 UTC =
    # 6:00-7:59 lokale tijd tijdens zomertijd (UTC+2). Let op: bij
    # terugschakelen naar wintertijd (eind okt, UTC+1) schuiven beide
    # vensters een uur op (13:00-14:59 resp. 7:00-8:59 lokaal) -- dan
    # moeten deze cron-regels handmatig aangepast worden naar 11-12 UTC
    # resp. 5-6 UTC.
    # Let ook op: GitHub Actions' scheduled workflows op publieke/gratis
    # repo's lopen zelf regelmatig 1-3 uur achter op de ingestelde cron
    # (bekende platformbeperking, niet iets wat deze instelling kan
    # oplossen) -- dit verkleint het gat in de praktijkgevoelige vensters,
    # lost het niet volledig op.
    - cron: '0 * * * *'
    - cron: '*/15 10-11 * * *'
    - cron: '*/10 4-5 * * 1-5'
  workflow_dispatch:
    inputs:
      mfa_code:
        description: 'MFA-code (alleen nodig bij eerste login of na sessieverval)'
        required: false
        type: string

jobs:
  sync-garmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installeer garminconnect
        run: pip install --upgrade garminconnect curl_cffi requests

      - name: Sync Garmin voor Nando
        env:
          GARMIN_OWNER: Nando
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL_NANDO }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD_NANDO }}
          GARMIN_MFA_CODE: ${{ inputs.mfa_code }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/sync_garmin.py
