name: Auto-sync Garmin

# Synct vitals, trainingsactiviteiten en gewicht -- nu Tredict's API
# betaalde toegang vereist (402) is dit de belangrijkste bron geworden,
# niet meer alleen een test-aanvulling. Zie scripts/sync_garmin.py voor
# uitleg waarom dit als Python GitHub Action draait i.p.v. als Supabase
# edge function.
#
# Vereiste repo-secrets (Settings -> Secrets and variables -> Actions):
#   GARMIN_EMAIL_NANDO, GARMIN_PASSWORD_NANDO  (je gewone Garmin Connect-login)
#
# Bij de EERSTE run kan Garmin een MFA-code vragen. Start de workflow dan
# handmatig via "Run workflow" hierboven met de mfa_code-input ingevuld
# (code uit je Garmin-e-mail/authenticator-app). Daarna hergebruikt elke
# geplande run de opgeslagen sessie, geen MFA meer nodig totdat die verloopt.

on:
  schedule:
    # Elke 15 min -- vaker dan het eerdere hele uur, op verzoek (o.a. om
    # sync-timing-vertraging na een training/weging sneller te laten
    # bijtrekken). Let op: GitHub Actions' scheduled workflows op publieke/
    # gratis repo's lopen zelf regelmatig 1-3 uur achter op de ingestelde
    # cron (bekende platformbeperking, niet iets wat deze instelling kan
    # oplossen) -- vaker plannen verkleint de kans op een grote vertraging,
    # maar garandeert geen realtime sync. Nog steeds niet elke paar
    # minuten, om het risico op rate-limiting bij Garmin's onofficiele
    # login te beperken.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mfa_code:
        description: 'MFA-code (alleen nodig bij eerste login of na sessieverval)'
        required: false
        type: string

jobs:
  sync-garmin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installeer garminconnect
        run: pip install --upgrade garminconnect curl_cffi requests

      - name: Sync Garmin voor Nando
        env:
          GARMIN_OWNER: Nando
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL_NANDO }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD_NANDO }}
          GARMIN_MFA_CODE: ${{ inputs.mfa_code }}
        run: python3 scripts/sync_garmin.py
